# CI: build data, train, run all tests, and enforce a quality gate on the TEST snapshot.
name: ci
on:
  push: { branches: [main] }
  pull_request:

env:
  RETAINIQ_ROOT: ${{ github.workspace }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Build data and train (reproducible from seed)
        run: |
          python src/data_gen.py
          python src/train.py
      - name: Tests (leakage, API, drift, dashboard)
        run: python -m pytest -q
      - name: Quality gate - model must beat a floor on the TEST snapshot
        run: |
          python - <<'PY'
          import json, os
          m = json.load(open(os.environ["RETAINIQ_ROOT"] + "/artifacts/model_meta.json"))
          pr = m["metrics"]["test"]["pr_auc"]
          print("test pr_auc =", pr)
          assert pr > 0.45, "Model fell below the quality gate"
          PY
      - name: Build Docker image
        run: docker build -t retainiq .
      - name: Run container and check /health
        run: |
          docker run -d --name api -p 8000:8000 retainiq
          for i in $(seq 1 20); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 3
          done
          docker logs api
          exit 1
